name: Content & Accessibility Checks

# Runs spellcheck and an accessibility scan on every push to dev and every PR
# into main. This used to also build a STATIC_EXPORT (output: export) copy of
# the site and deploy it to GitHub Pages, but that's fundamentally
# incompatible with the Stripe/Supabase API routes added later (force-dynamic
# route handlers can't exist in a static export at all — Next.js hard-errors
# on it) and was redundant besides: Vercel already deploys dev on every push
# and PR with full server support. Removed rather than worked around.

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Key by PR number for pull_request events and by ref for push events so a
  # PR run and a dev-push run never cancel each other, while same-PR /
  # same-branch reruns still cancel their predecessor as before.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # The actual Next.js project lives in frontend/, not the repo root (see
    # frontend/package.json). Every plain `run:` step below is relative to
    # this. This does NOT apply to `uses:` steps' own `with:` inputs (e.g.
    # actions/checkout, actions/setup-node's cache-dependency-path) — those
    # still need frontend/ spelled out explicitly, since they're action
    # inputs, not shell commands.
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          # vitest 5 (frontend/package.json) requires Node ^22.12/^24/>=26 to
          # even run, not just as an @types/node peer range — matches the
          # Node 24.x this project's Vercel deployment already targets.
          node-version: 24
          cache: npm
          # Without this, setup-node's cache step looks for the lockfile at
          # the repo root by default and fails outright ("Dependencies lock
          # file is not found") since it lives at frontend/package-lock.json.
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies and run tests
        id: install-and-test
        run: npm install && npm test

      - name: Build
        id: build
        run: npm run build

      - name: Spell check
        id: spellcheck
        if: always()
        uses: alcash55/ac-composite-actions/markdown-checks/spellcheck@main
        with:
          # No pull_request context on a push-triggered workflow, so DIFF
          # stays empty. EXTENSIONS must be set explicitly or the action's
          # check step is skipped entirely (empty DIFF + empty EXTENSIONS
          # reads as "no PR files changed", not "check everything").
          #
          # This action's whole-checkout glob is a plain `git ls-files`
          # filtered by extension — it isn't scoped to this job's
          # working-directory, and there's no path-prefix input to narrow
          # it further. md/mdx and json were dropped deliberately: with them
          # included this also globs backend/.agents/skills/**/*.md (vendored
          # third-party reference docs, not our content — dozens of false
          # positives from Postgres/SQL jargon) and every package-lock.json
          # in the repo (npm package name fragments, 80+ "issues" each).
          # ts/tsx/html covers the actual site source, which is where the
          # user-facing copy this check exists for actually lives.
          EXTENSIONS: ts,tsx,html
          # Project vocabulary (brand names, physiology terms, font names,
          # etc.) merged with the action's shared baseline via cspell's own
          # "import" mechanism. Built from a real cspell run against this
          # site's content — see the file's own header comment.
          DICTIONARY: frontend/.cspell-project.json

      # The action above only reports SPELL_ERRORS, it never fails its own
      # step — this step turns a non-empty result into a real step failure
      # so the aggregator below can key off `steps.spellcheck-check.outcome`
      # instead of re-parsing JSON output.
      - name: Check spellcheck results
        id: spellcheck-check
        if: always()
        env:
          # Env var rather than inline interpolation: this is cspell text
          # pulled from this site's own prose, which is full of contractions
          # ("isn't", "doesn't"). Interpolating "${{ ... }}" directly inside a
          # quoted shell string breaks on the first embedded apostrophe.
          SPELLCHECK_RESULT: ${{ steps.spellcheck.outputs.SPELL_ERRORS }}
        run: |
          if [ -z "$SPELLCHECK_RESULT" ] || [ "$SPELLCHECK_RESULT" = '[]' ]; then
            echo "Spellcheck: no issues"
            exit 0
          fi
          echo "::group::Spellcheck violations"
          echo "$SPELLCHECK_RESULT"
          echo "::endgroup::"
          echo "::error::Spellcheck found issues, see the group above."
          exit 1

      - name: Serve built app for accessibility check
        id: serve-app
        if: always()
        # `next start` (a real server), not a static export — the pages
        # under test don't call the API routes on render, and both
        # lib/stripe.ts and lib/supabaseAdmin.ts construct their clients
        # lazily inside functions, so this boots fine with no Stripe/
        # Supabase secrets configured.
        run: |
          npx next start -p 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Next server never came up on :4173" && exit 1

      - name: accessibility analysis
        id: a11y
        if: always()
        # TEMPORARY: upstream bug in this action, tracked at
        # alcash55/ac-composite-actions#27 — self-driven mode
        # (BASE_URL+ROUTES, what we use) calls browser.newPage() instead of
        # browser.newContext() + context.newPage() in
        # accessibility/axe-check/index.js's runAxeSelfDriven(), which
        # @axe-core/playwright rejects with "Please use browser.newContext()".
        # This is a *different* bug than the one originally here (bare
        # `yarn check` shadowing the action's own package.json script,
        # alcash55/ac-composite-actions#47 — fixed and merged in #48, so
        # that part is no longer why this fails). continue-on-error stays
        # until #27 lands. Remove it once that's fixed.
        continue-on-error: true
        uses: alcash55/ac-composite-actions/accessibility/axe-check@main
        with:
          BASE_URL: http://localhost:4173
          ROUTES: "/ /about /about-me /training /pricing /contact /privacy /terms /checkout/cancelled"

      # Same reasoning as spellcheck-check above: axe-check only reports
      # AXE_VIOLATIONS, it never fails its own step.
      - name: Check accessibility results
        id: a11y-check
        if: always()
        env:
          A11Y_RESULT: ${{ steps.a11y.outputs.AXE_VIOLATIONS }}
        run: |
          if [ -z "$A11Y_RESULT" ] || [ "$A11Y_RESULT" = '[]' ]; then
            echo "Accessibility: no issues"
            exit 0
          fi
          echo "::group::Accessibility violations"
          echo "$A11Y_RESULT"
          echo "::endgroup::"
          echo "::error::Accessibility found issues, see the group above."
          exit 1

      # Every step this job cares about has `if: always()`, so a failure in
      # one (e.g. spellcheck-check) never skips the rest (e.g. a11y-check) —
      # they all run and each fails independently when it finds a problem.
      # This step only runs once something already failed (if: failure()),
      # and just names which step ids did, by reading each one's own
      # `.outcome` rather than re-deriving pass/fail from output JSON.
      - name: Report failed steps
        id: report-failed-steps
        if: failure()
        env:
          OUTCOME_setup_node: ${{ steps.setup-node.outcome }}
          OUTCOME_install_and_test: ${{ steps.install-and-test.outcome }}
          OUTCOME_build: ${{ steps.build.outcome }}
          OUTCOME_spellcheck_check: ${{ steps.spellcheck-check.outcome }}
          OUTCOME_serve_app: ${{ steps.serve-app.outcome }}
          OUTCOME_a11y_check: ${{ steps.a11y-check.outcome }}
        run: |
          declare -A STEP_OUTCOMES=(
            ["setup-node"]="$OUTCOME_setup_node"
            ["install-and-test"]="$OUTCOME_install_and_test"
            ["build"]="$OUTCOME_build"
            ["spellcheck-check"]="$OUTCOME_spellcheck_check"
            ["serve-app"]="$OUTCOME_serve_app"
            ["a11y-check"]="$OUTCOME_a11y_check"
          )

          echo "::error::The following steps failed:"
          for id in "${!STEP_OUTCOMES[@]}"; do
            if [ "${STEP_OUTCOMES[$id]}" = "failure" ]; then
              echo "  - $id"
            fi
          done
